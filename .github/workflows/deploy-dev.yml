name: Deploy Dev

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.14
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - name: Install Python dependencies
      run: pip install tox
    - name: Test with tox
      run: tox -e py,flake8,black
    - name: Set up AWS SAM CLI
      uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
      with:
        use-installer: true
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Validate SAM template
      run: sam validate --lint --region eu-west-1
    - name: Build Docker image
      run: sam build
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_DEV }}:role/github-deploy
        aws-region: eu-west-1
    - name: Sts GetCallerIdentity
      run: aws sts get-caller-identity
    - name: Deploy Lambda functions
      run: sam deploy --config-env dev --image-repository ${{ secrets.AWS_ACCOUNT_DEV }}.dkr.ecr.eu-west-1.amazonaws.com/serverless-okdata-maskinporten-api-dev --parameter-overrides "Stage=dev GitRev=${GITHUB_REF_NAME}:${GITHUB_SHA::7}"
